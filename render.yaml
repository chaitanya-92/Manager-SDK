services:
  - type: web
    name: manager-sdk
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm test && npm run build
    startCommand: node worker/hosted-start.mjs
    healthCheckPath: /healthz
    envVars:
      - key: MANAGER_SDK_HOST
        value: render
      - key: NODE_VERSION
        value: 22.16.0
      - key: MANAGER_SDK_USER
        value: owner
      - key: MANAGER_SDK_PASSWORD
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVER_KEY
        sync: false
